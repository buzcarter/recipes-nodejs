name: CI

# Lint, type-check, test, and build every pull request so problems surface before merge.
# (Deploying happens separately, in publishRecipeBook.yml, on pushes to main.)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same PR supersedes the run in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to a commit SHA (tag noted alongside), matching publishRecipeBook.yml
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npm run typecheck
      - name: Test
        run: npm test
      # builds the sample recipes into ./output; fails the check if any page, image, or copy step fails
      - name: Build Site
        run: npm run build
