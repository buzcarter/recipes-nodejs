name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# least privilege: only the deploy job may write (to the gh-pages branch)
permissions:
  contents: read

# never run two deploys at once; let an in-progress one finish
concurrency:
  group: publish-recipe-book
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # third-party actions are pinned to a commit SHA (tag noted alongside) so a moved tag can't change what runs
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Lint, Type Check & Test
        run: npm run lint && npm run typecheck && npm test
      - name: Build Site
        run: npm run build && rsync -av --remove-source-files ./output/ ./docs/
      - name: Deploy Site
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
